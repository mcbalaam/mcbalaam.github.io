[stack]
typescript = "Строгая (и статическая) типизация меня весьма привлекает — настолько, что я де-факто теперь считаю её обязательной в языке/фреймворке. На TypeScript я написал mis-fortune и exteraStore, работаю ещё над одним проектом — скрейпером Discord каналов, превращающем ваши каналы в RSS фид."
go = "Go — идеальная середина языков для бэкенда: компилируемый, умеет в статическую линковку, собирается в WASM, не требует VM, типобезопасный, не заставляет работать с памятью (использует GC) и интегрирован с Git. Хоть в нём и нет привычного ООП через классы, но есть его парадигмы: инкапсуляция, полиморфизм, абстракция. Это нечто более barebones чем классы, и мне это нравится."
react = "На React я больше года работал с интерфейсами и компонентами для Space Station 13. Из личных крупных проектов на данный момент написаны mis-fortune и небольшая библиотека компонентов RazdorUI, из которой и собрана эта страничка."
docker = "Хоумлабщик, самостоятельно хосчу некоторые нужные для себя сервисы. Пишу докерфайлы, создаю конфиги, работаю с сетями. Могу упаковать для развёртки и прода небольшие проекты, работать с секретами и пайплайнами."
ansible = "Мой прокси-VPS императивно описан Ansible. Мне лично больше нравятся декларативные решения (вроде Nix или Guix), но работать с де-факто корпоративными стандартами тоже умею."
monitoring = "Настроил мониторинг за своими сервисами через Gatus, алертинг через Ntfy. Умею работать и с Prometheus/Grafana, но для моего текущего сетапа оверкилл."

