[projects]
fortune = "Оверлей для Twitch чата в стиле SS13, прямо в вашем браузере. Поддерживает бейджи, эмоуты 7TV/BTTV/FFZ"
extera = "API сервер и вершн-контрол для плагинов exteraGram. Сейчас не запущен, переезжает на микросервисную архитектуру"
ebitter = "Набор утилит и систем для создания игр на основе Go (ebitengine): поддержка Aseprite спрайтщитов и карт Tiled, система сцен и камеры и многое другое"
razdor = "Библиотека React компонентов в стиле Discord: базовые стилизованные компоненты и навигация, система тем, уведомления. Использована на этой страничке, кстати."
graft = "Go-утилита для бэкапа отдельных директорий на Git в виде \"блобов\" (сабмодулей), менеджмента, переноса и восстановления. Релизы уже на GitHub и планируются в AUR!"
picorss = "Минимальный RSS сервер для персонального RSS-фида: микроскопическая замена новостным ТГК и блогсайтам без единой зависимости (ну, кроме stdio)."

[demo]
