[projects]
fortune = "A Twitch chat overlay utility styled as SS13 chat that runs in your browser, hosted on GitHub Pages. Supports 7TV/BTTV/FFZ and Twitch's native emotes and badges"
to18ml = "A framework-agnostic i18n library sourced from TOML supporting pluralization, nested lists and typed snippets."
ebitter = "A set of utilities for developing games in Go using ebitengine. Provides Aseprite spritesheet and Tiled map support, scene and camera systems and much more"
razdor = "A React general utility component library for making Discord-like UIs. Basic styled components, theme support, toast notifications. Used on this page, btw."
graft = "A Go utility for managing, backuping and restoring sparse directories to Git as \"blobs\" (submodules). Releases available on GitHub and AUR releases planned!"
picorss = "An RSS server for ants; a very tiny zero-dependency personal RSS feed to replace your TGC or personal blogs."

[demo]
title = "undebitter: demo (click the game window to focus input)"
screenTooSmall = "Your device's screen is too small to render the demo, and you might not have a keyboard to control it."

[stack]
typescript = "Strict (and static) typing appeals to me greatly — so much that I now consider it a de facto requirement in any language or framework. I wrote mis-fortune and exteraStore in TypeScript, and I'm working on another project — a Discord channel scraper that turns your channels into an RSS feed."
go = "Go is a great language: not interpreted, may be statically linked, can be compiled to WASM, no VMs needed, a garbage collector for those of us who don't like strict memory control, Git integration, an incredible \"package\" system. While it is not an OOP language as we're used to it (with classes), the primary OOP prardigms are there: incapsulation, composition, polymorphism. A little more barebones than classes, and I'm here for it."
react = "I spent over a year working with React interfaces and components for Space Station 13. mis-fortune and RazdorUI are my main personal projects built with it (aside from this page)."
docker = "Homelab enthusiast, self-hosting various services I need. Writing Dockerfiles, creating configs. Can containerize small projects for deployment and production, work with secrets and pipelines."
ansible = "My proxy VPS and my home server are imperatively configured with Ansible. While I'm more a fan of declarative configuration (Nix), I know my way around de-facto default corporate solutions."
monitoring = "My server is monitored by Gatus and alerting is set up through Ntfy. I can also work with Grafana/Prometheus, but for my setup it's overkill."

